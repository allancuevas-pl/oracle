<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Property Lions lion crest on ceremonial navy. Generated from
         public/property-lions-logo.png (crest only). -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Schibsted Grotesk — the UI typeface. Loaded with display=swap so text
         paints immediately in the system fallback, then swaps with no blank flash. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Client portal login typefaces: Marcellus (ceremonial serif title) +
         Jost (form + UI). Used only on the Property Lions client login screen. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Oracle</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
